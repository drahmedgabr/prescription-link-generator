<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prescription Link Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Tahoma",sans-serif;background:#f5f7fb;color:#172033;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #e6e9ef;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(20,30,50,.08)}h1{font-size:27px;margin:0 0 8px;text-align:center}.sub{font-size:16px;color:#687386;text-align:center;margin-bottom:25px}.notice{background:#f0f6ff;border-radius:12px;padding:14px 16px;line-height:1.8;font-size:16px;margin-top:24px;margin-bottom:20px}.notice b{color:#1769e0}.label{display:block;font-size:16px;font-weight:700;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #d7dce5;border-radius:10px;font-size:18px;outline:none;direction:ltr;text-align:left}input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.result{margin-top:18px;padding:14px;background:#fafbfc;border:1px solid #e7eaf0;border-radius:12px}.result-title{font-size:14px;color:#7a8494;margin-bottom:7px}.link{display:block;color:#1769e0;text-decoration:none;direction:ltr;text-align:left;word-break:break-all;font-size:17px;cursor:pointer}.link:hover{text-decoration:underline}.hint{text-align:center;font-size:14px;color:#7a8494;margin-top:8px;min-height:17px}.copied{color:#159447;font-weight:700}</style>
</head>
<body>
<div class="card">
  <h1>رابط الاستشارة</h1>
  <div class="sub">أدخل الـ Order ID لعمل رابط الوصفة</div>
  <label class="label" for="orderId">Order ID</label>
  <input id="orderId" type="text" inputmode="numeric" autocomplete="off" placeholder="مثال: 1234">
  <div class="notice">اضغط على الرابط بالأسفل <b>لنسخه</b> مباشرة.</div>
  <div class="result">
    <div class="result-title">الرابط</div>
    <a id="link" class="link" href="#" style="display:none"></a>
    <div id="empty" class="hint">اكتب الـ Order ID لعرض الرابط</div>
  </div>
  <div id="status" class="hint"></div>
</div>
<script>
const input=document.getElementById('orderId'),link=document.getElementById('link'),empty=document.getElementById('empty'),status=document.getElementById('status');
function update(){
 const id=input.value.trim();
 if(!id){link.style.display='none';empty.style.display='block';status.textContent='';return}
 const url='https://ana.ninja/l/prescription?id='+encodeURIComponent(id);
 link.textContent=url;link.href=url;link.style.display='block';empty.style.display='none';status.textContent='';status.className='hint';
}
input.addEventListener('input',update);
link.addEventListener('click',async e=>{e.preventDefault();const url=link.textContent;try{await navigator.clipboard.writeText(url);status.textContent='تم نسخ الرابط ✓';status.className='hint copied';}catch(err){const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();status.textContent='تم نسخ الرابط ✓';status.className='hint copied';}});
</script>
</body>
</html>
